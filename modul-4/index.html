<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Portfolio Tracker - Modul 4</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, sans-serif;
      }
      body {
        background-color: #f1f5f9;
        color: #0f172a;
        padding: 30px 15px;
      }
      .container {
        max-width: 820px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #1e3a8a;
        font-size: 24px;
        margin-bottom: 5px;
      }
      h2 {
        color: #1e3a8a;
        font-size: 15px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 12px;
      }
      p.subtitle {
        color: #64748b;
        margin-bottom: 20px;
        font-size: 14px;
      }

      /* ===== Kartu Statistik ===== */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 25px;
      }
      .stat-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
      }
      .stat-card h3 {
        font-size: 13px;
        color: #64748b;
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .stat-card p {
        font-size: 20px;
        font-weight: bold;
        color: #1e3a8a;
      }

      /* ===== Form Input Proyek ===== */
      .form-section {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 25px;
        background: #f8fafc;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .form-field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .form-field label {
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .form-field input[type="text"],
      .form-field input[type="number"],
      .form-field select {
        padding: 9px 11px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        color: #0f172a;
        background: #ffffff;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-field input:focus,
      .form-field select:focus {
        border-color: #1e3a8a;
        box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
      }
      .form-check {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        padding-bottom: 9px;
      }
      .form-check input {
        width: 16px;
        height: 16px;
        accent-color: #1e3a8a;
        cursor: pointer;
      }
      .form-check label {
        text-transform: none;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .form-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .btn-submit {
        padding: 9px 20px;
        background: #1e3a8a;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }
      .btn-submit:hover {
        background: #172554;
      }
      .btn-submit:active {
        transform: scale(0.98);
      }
      .form-message {
        font-size: 13px;
        font-weight: 500;
        min-height: 18px;
      }
      .form-message.error {
        color: #b91c1c;
      }
      .form-message.success {
        color: #15803d;
      }

      /* ===== Pencarian & Filter ===== */
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 20px;
      }
      .search-box {
        flex: 1 1 240px;
        position: relative;
      }
      .search-box input {
        width: 100%;
        padding: 9px 11px 9px 34px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .search-box input:focus {
        border-color: #1e3a8a;
        box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
      }
      .search-box::before {
        content: "\1F50D";
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 13px;
        opacity: 0.6;
      }
      .filter-group {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .btn-filter {
        padding: 8px 16px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s;
      }
      .btn-filter.active,
      .btn-filter:hover {
        background: #1e3a8a;
        color: #ffffff;
        border-color: #1e3a8a;
      }

      /* ===== Kartu Proyek ===== */
      .project-card {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: #ffffff;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .project-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }
      .project-info h4 {
        font-size: 16px;
        color: #0f172a;
        margin-bottom: 4px;
      }
      .project-category {
        display: inline-block;
        font-size: 12px;
        color: #0284c7;
        background: #e0f2fe;
        padding: 2px 8px;
        border-radius: 4px;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .project-budget {
        font-size: 14px;
        color: #334155;
        font-weight: 600;
      }
      .project-side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }
      .badge {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge-success {
        background: #dcfce7;
        color: #166534;
      }
      .badge-pending {
        background: #fef9c3;
        color: #854d0e;
      }
      .card-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .btn-action {
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background 0.2s, color 0.2s;
      }
      .btn-toggle {
        background: #e0f2fe;
        color: #0369a1;
        border-color: #bae6fd;
      }
      .btn-toggle:hover {
        background: #0284c7;
        color: #ffffff;
      }
      .btn-delete {
        background: #fee2e2;
        color: #b91c1c;
        border-color: #fecaca;
      }
      .btn-delete:hover {
        background: #dc2626;
        color: #ffffff;
      }
      .empty-state {
        text-align: center;
        color: #64748b;
        padding: 24px;
        font-size: 14px;
        border: 1px dashed #cbd5e1;
        border-radius: 8px;
      }

      @media (max-width: 520px) {
        .project-card {
          flex-direction: column;
          align-items: flex-start;
        }
        .project-side {
          align-items: flex-start;
          width: 100%;
        }
        .card-actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Interactive Portfolio Tracker</h1>
      <p class="subtitle">
        Modul 4: Pengolahan Logika Data &amp; Interaktivitas DOM
      </p>

      <!-- Kartu Ringkasan Statistik -->
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Proyek</h3>
          <p id="stat-total-projects">0</p>
        </div>
        <div class="stat-card">
          <h3>Total Anggaran</h3>
          <p id="stat-total-budget">Rp 0</p>
        </div>
        <div class="stat-card">
          <h3>Selesai Dikerjakan</h3>
          <p id="stat-completed-projects">0</p>
        </div>
      </div>

      <!-- Formulir Input Proyek -->
      <section class="form-section">
        <h2>Tambah Proyek Baru</h2>
        <form id="project-form" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label for="input-title">Judul Proyek</label>
              <input
                type="text"
                id="input-title"
                name="title"
                placeholder="Contoh: Sistem Informasi Akademik"
                autocomplete="off"
              />
            </div>
            <div class="form-field">
              <label for="input-category">Kategori</label>
              <select id="input-category" name="category">
                <option value="Web App">Web App</option>
                <option value="Mobile App">Mobile App</option>
                <option value="Desktop App">Desktop App</option>
                <option value="UI/UX Design">UI/UX Design</option>
              </select>
            </div>
            <div class="form-field">
              <label for="input-budget">Estimasi Anggaran (Rp)</label>
              <input
                type="number"
                id="input-budget"
                name="budget"
                placeholder="Contoh: 5000000"
                min="0"
                step="1000"
              />
            </div>
            <div class="form-field form-check">
              <input type="checkbox" id="input-completed" name="completed" />
              <label for="input-completed">Sudah Selesai</label>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-submit">Tambah Proyek</button>
            <span id="form-message" class="form-message" role="status"></span>
          </div>
        </form>
      </section>

      <!-- Pencarian Real-Time -->
      <div class="toolbar">
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            placeholder="Cari judul proyek..."
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Tombol Filter Kategori -->
      <div class="filter-group">
        <button class="btn-filter active" data-category="all">
          Semua Proyek
        </button>
        <button class="btn-filter" data-category="Web App">Web App</button>
        <button class="btn-filter" data-category="Mobile App">
          Mobile App
        </button>
        <button class="btn-filter" data-category="Desktop App">
          Desktop App
        </button>
        <button class="btn-filter" data-category="UI/UX Design">
          UI/UX Design
        </button>
      </div>

      <!-- Kontainer Daftar Proyek -->
      <div id="project-list"></div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
